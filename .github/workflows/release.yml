name: Release

# Release assets are attached when the release is created, never afterwards:
# the repository has immutable releases enabled, and an upload to an existing
# release fails with `HTTP 422: Cannot upload assets to an immutable release`.
# That is why the two matrix builds only upload workflow artifacts and a single
# job creates the release with both disk images in one call.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.target }}

      - name: install frontend dependencies
        run: npm ci

      - name: build the app
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles app

      # The disk image is assembled by dmg/build.sh: it lays the Finder window
      # out itself and fails the run when the stored positions are not the ones
      # the background was drawn for.
      - name: build the disk image
        id: dmg
        run: |
          set -eu
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          dmg="src-tauri/target/${{ matrix.target }}/release/bundle/dmg/Colima Desk_${version}_${{ matrix.arch }}.dmg"
          src-tauri/dmg/build.sh \
            "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Colima Desk.app" \
            "$dmg"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: dmg-${{ matrix.arch }}
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dmg-*
          merge-multiple: true
          path: dmg

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tag="${{ github.ref_name }}"
          ls -l dmg
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::release $tag already exists, and an immutable release cannot accept assets afterwards — delete the release and push the tag again"
            exit 1
          fi
          gh release create "$tag" \
            --verify-tag \
            --title "Colima Desk $tag" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)." \
            dmg/*
